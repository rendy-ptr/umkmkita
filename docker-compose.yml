version: '3.8'

services:
  umkmkita-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: umkmkita-render-image
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      # Gunakan APP_KEY dari .env Anda atau generate yang baru
      - APP_KEY=base64:E+4LgU9QZk03G4qWkFz5X2B1C2VvF4W9O3LpQkM4nE8=
      - DB_CONNECTION=sqlite
      - LOG_CHANNEL=stderr
      - GROQ_API_KEY=${GROQ_API_KEY:-}
